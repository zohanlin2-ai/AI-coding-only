name: Deploy 4x4 Rubik's Cube to GitHub Pages

on:
  push:
    branches: [main, claude/latest-commit-status-i4hror]
    paths:
      - 'Rubik_s_cube_4x4/**'
      - '.github/workflows/deploy-4x4-cube.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rubik_s_cube_4x4/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Rubik_s_cube_4x4

      - name: Build
        run: npm run build
        working-directory: Rubik_s_cube_4x4

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Rubik_s_cube_4x4/dist

      - uses: actions/deploy-pages@v4
        id: deployment
